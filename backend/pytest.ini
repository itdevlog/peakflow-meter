[tool:pytest]
# Настройки для pytest
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Добавляем директорию src в путь для импорта
pythonpath = .

# Параметры для вывода
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Маркеры тестов
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    api: marks tests as API tests
    telegram: marks tests as Telegram bot tests
    zone: marks tests as zone calculation tests
    reminder: marks tests as reminder system tests

# Исключаемые файлы
norecursedirs = 
    .git
    .venv
    venv
    node_modules
    dist
    build
    *.egg-info