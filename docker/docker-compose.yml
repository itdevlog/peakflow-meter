version: '3.8'

services:
  # База данных PostgreSQL
  db:
    image: postgres:15
    container_name: peakflow_db
    environment:
      POSTGRES_DB: peakflow_db
      POSTGRES_USER: peakflow_user
      POSTGRES_PASSWORD: peakflow_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - peakflow_network
    restart: unless-stopped

  # Redis для кеширования и брокера задач
  redis:
    image: redis:7-alpine
    container_name: peakflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - peakflow_network
    restart: unless-stopped

  # Основное приложение FastAPI
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: peakflow_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://peakflow_user:peakflow_pass@db:5432/peakflow_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=09d25e094faa6ca2556c818166b7a9563b93f709f6f0f4caa6cf63b88e8d3e7
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      - db
      - redis
    networks:
      - peakflow_network
    restart: unless-stopped

  # Воркер Celery для обработки фоновых задач
  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: peakflow_celery
    command: celery -A app.tasks worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://peakflow_user:peakflow_pass@db:5432/peakflow_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=09d25e094faa6ca2556c818166b7a9563b93f709f6f0f4caa6cf63b88e8d3e7
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      - db
      - redis
      - backend
    networks:
      - peakflow_network
    restart: unless-stopped

  # Планировщик задач Celery Beat
  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: peakflow_celery_beat
    command: celery -A app.celery_beat_config beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://peakflow_user:peakflow_pass@db:5432/peakflow_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=09d25e094faa6ca2556c818166b7a9563b93f709f6f0f4caa6cf63b88e8d3e7
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      - db
      - redis
      - backend
    networks:
      - peakflow_network
    restart: unless-stopped

  # Веб-интерфейс
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: peakflow_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - peakflow_network
    restart: unless-stopped

  # Nginx как обратный прокси
  nginx:
    image: nginx:alpine
    container_name: peakflow_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ../ssl:/etc/nginx/ssl  # для SSL сертификатов
    depends_on:
      - backend
      - frontend
    networks:
      - peakflow_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  peakflow_network:
    driver: bridge